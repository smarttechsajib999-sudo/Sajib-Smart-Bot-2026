import os, sys, subprocess, time, random, glob, pickle, json

# ১. লাইব্রেরিগুলো অটো-ইন্সটল করার ব্যবস্থা
def install_requirements():
    print("🛠️ সজীব, তোর সিস্টেম রেডি করছি... লাইব্রেরি ইন্সটল হচ্ছে।")
    pkgs = ["requests", "google-generativeai", "google-api-python-client", "duckduckgo-search", "mutagen", "numpy", "opencv-python-headless"]
    subprocess.check_call([sys.executable, "-m", "pip", "install", "-q"] + pkgs)
    os.system("sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null")

install_requirements()

import requests
from mutagen.mp3 import MP3
import google.generativeai as genai
from googleapiclient.discovery import build
from googleapiclient.http import MediaFileUpload

# ২. তোর ৩টি চাবি সরাসরি এখানে অ্যাড করে দিলাম
PEXELS_API_KEY = "NsXM87PP9rOpl2kZoGh3rbY5FSZuGUURrlQxO2mC3nVjOSDBDlgWnkJF"
ELEVENLABS_API_KEY = "sk_e550b35b2daa91280dc1823876db714e265a973df2daadae"
GEMINI_API_KEY = "AIzaSyD98qV_oHMMXXVm90Cd5CbddITpWXZcBng"

def start_engine():
    print("🎬 সজীবের প্রো-বট চালু হচ্ছে...")
    
    # ব্র্যাকেটওয়ালা ফাইল (token (3).pickle) খুঁজে বের করা
    pickle_files = glob.glob("token*.pickle")
    if not pickle_files:
        print("❌ এরর: কোনো token.pickle ফাইল পাওয়া যায়নি! ফাইল আপলোড কর।")
        return
    
    token_file = pickle_files[0] 
    print(f"✅ টোকেন ফাইল পাওয়া গেছে: {token_file}")

    # ৩. জেমিনি দিয়ে ভাইরাল হিংলিশ কাহিনী তৈরি
    genai.configure(api_key=GEMINI_API_KEY)
    model = genai.GenerativeModel('gemini-1.5-flash')
    try:
        prompt = "Write a viral 2-sentence emotional story about success in Hinglish. Start with a hook. No emojis."
        res = model.generate_content(prompt)
        script = res.text.strip()
    except:
        script = "Jab sab sath chhod dein, tab samajh lena kamyabi ka waqt shuru hua hai."
    print(f"📝 স্ক্রিপ্ট রেডি: {script}")

    # ৪. ইলেভেন ল্যাবস দিয়ে হাই-কোয়ালিটি ভয়েস
    print("🎙️ প্রফেশনাল ভয়েস তৈরি হচ্ছে...")
    voice_url = "https://api.elevenlabs.io/v1/text-to-speech/pNInz6obpgDQGcFmaJgB" # Adam Voice
    headers = {"xi-api-key": ELEVENLABS_API_KEY, "Content-Type": "application/json"}
    data = {"text": script, "model_id": "eleven_multilingual_v2"}
    r = requests.post(voice_url, json=data, headers=headers)
    
    if r.status_code == 200:
        with open("voice.mp3", "wb") as f: f.write(r.content)
    else:
        print(f"❌ ভয়েস এরর: {r.text}"); return

    # ৫. পিক্সেল থেকে এইচডি ভিডিও ডাউনলোড
    print("⬇️ এইচডি ভিডিও ডাউনলোড হচ্ছে...")
    headers_v = {"Authorization": PEXELS_API_KEY}
    v_search_url = "https://api.pexels.com/videos/search?query=cinematic motivation dark&per_page=1&orientation=portrait"
    v_data = requests.get(v_search_url, headers=headers_v).json()
    
    if v_data.get('videos'):
        v_link = v_data['videos'][0]['video_files'][0]['link']
        with open("video.mp4", "wb") as f: f.write(requests.get(v_link).content)
    else:
        print("❌ ভিডিও পাওয়া যায়নি!"); return

    # ৬. এফএফএমপিইগ দিয়ে মাস্টার এডিটিং
    print("🎬 প্রো-লেভেল এডিটিং চলছে...")
    audio_dur = MP3("voice.mp3").info.length
    # ভিডিওকে অডিওর সাথে লুপ করে ফিট করা
    os.system(f'ffmpeg -y -stream_loop -1 -i video.mp4 -i voice.mp3 -map 0:v -map 1:a -c:v libx264 -t {audio_dur} final.mp4')

    # ৭. ইউটিউবে অটোমেটিক আপলোড
    print("☁️ ইউটিউবে আপলোড হচ্ছে...")
    try:
        with open(token_file, 'rb') as t: creds = pickle.load(t)
        yt = build('youtube', 'v3', credentials=creds)
        yt.videos().insert(
            part="snippet,status",
            body={
                "snippet": {
                    "title": "Kamyabi ki Kahani 🔥 #Shorts #Success #Motivation",
                    "description": script,
                    "categoryId": "27"
                },
                "status": {"privacyStatus": "public"}
            },
            media_body=MediaFileUpload("final.mp4", resumable=True)
        ).execute()
        print("🎉 অভিনন্দন সজীব! ভিডিও সফলভাবে আপলোড হয়ে গেছে।")
    except Exception as e:
        print(f"⚠️ আপলোড সমস্যা: {e}")

if __name__ == "__main__":
    start_engine()
    
